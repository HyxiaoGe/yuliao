services:
  yuliao-server:
    build: .
    image: yuliao-server
    container_name: yuliao-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - middleware_default
      - postgres_default

networks:
  middleware_default:
    external: true
  postgres_default:
    external: true
